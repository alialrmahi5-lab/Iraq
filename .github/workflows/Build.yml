name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip project
        run: unzip -q iraq_freight.zip

      - name: Prepare Android folders
        working-directory: iraq_freight
        run: dart tool/setup_android.dart --maps-key="${{ secrets.MAPS_API_KEY }}"

      - name: Build merchant app
        working-directory: iraq_freight/merchant_app
        run: flutter build apk --release

      - name: Build driver app
        working-directory: iraq_freight/driver_app
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p out
          cp iraq_freight/merchant_app/build/app/outputs/flutter-apk/app-release.apk out/merchant.apk
          cp iraq_freight/driver_app/build/app/outputs/flutter-apk/app-release.apk out/driver.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: out/*.apk
